<!DOCTYPE html>


<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Scr3 ME2</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <link href="https://db.onlinewebfonts.com/c/f3b96908571e6850a3528ca9cf555584?family=Univers+75+Black" rel="stylesheet">
        <link href="https://db.onlinewebfonts.com/c/63f874d192fb3892d88d5e26f942b5e2?family=DS-Digital" rel="stylesheet">
        <link href="https://db.onlinewebfonts.com/c/245dfaccc4e40bed366d044b06b44a52?family=Univers+49+Light+Ultra+Condensed" rel="stylesheet">
        <!-- references in resources doc -->
    </head>
    <body>
        <div id="game">
            <div id="background1"></div>
            <div id="mainScreen">
                <div id="background2"></div>
                <div class="StartGame">
                    <button id="StartButton", onclick="StartGame()">
                        Start Game?
                    </button>
                </div>

                <button onclick="clearHighscore()" id="timerbutton">
                    Clear Best Time
                    
                </button>

                <div id="timers">
                    <p id="currentTime" class="timer">
                        Current Time:<span class="digitalText"> 1</span>s
                    </p>
                    <p id="bestTime" class="timer">
                        Best Time:<span class="digitalText"> 1</span>s
                    </p>
                </div>

                <div id="scoreboard">
                    <p id="Player1Score" class="score">
                        1
                    </p>
                    <p id="Player2Score" class="score">
                        1
                    </p>
                </div>
                
                <div id = "paddle1"></div>
                <div id = "paddle2"></div>
                <div id = "pong-ball"></div>

                <div id="controlsDiv">
                    <p class="controls">
                        W up <br>
                        S down
                    </p>
                    <p class="controls">
                        ArrowUp up <br>
                        ArrowDown down
                    </p>
                </div>
                <div id="divider"></div>

            </div>
            
        </div>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="Scripts/main.js"></script>
        
    </body>
</html>
