<!DOCTYPE html>


<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Scr3 ME2</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="game">
            
            <div id="mainScreen">
                <div class="StartGame">
                    <button id="StartButton", onclick="StartGame()">
                        Start Game?
                    </button>
                </div>

                <button onclick="clearHighscore()" id="timerbutton">
                    Clear Best Time
                </button>

                <div id="timers">
                    <p id="currentTime" class="timer">
                        Current Time: 1s
                    </p>
                    <p id="bestTime" class="timer">
                        Best Time: 1s
                    </p>
                </div>

                <div id="scoreboard">
                    <p id="Player1Score" class="score">
                        1
                    </p>
                    <p id="Player2Score" class="score">
                        1
                    </p>
                </div>
                
                <div id = "paddle1"></div>
                <div id = "paddle2"></div>
                <div id = "pong-ball"></div>

                <div id="controlsDiv">
                    <p class="controls">
                        W up <br>
                        S down
                    </p>
                    <p class="controls">
                        ArrowUp up <br>
                        ArrowDown down
                    </p>
                </div>

            </div>
            <div id="divider"></div>
        </div>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="Scripts/main.js"></script>
        
    </body>
</html>
